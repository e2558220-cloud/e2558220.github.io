<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V系 - Visual Kei Archives</title>
  <style>
    /* --------------------------------------------------
       CSS: 基本スタイル & デザイン
    -------------------------------------------------- */
    :root {
      --bg-color: #0b0a0e;
      --card-bg: #15131a;
      --text-main: #e2e2e8;
      --text-sub: #a09cb0;
      --accent-red: #e60033;
      --accent-purple: #8a2be2;
      --border-color: #2a2635;
      --font-family: 'Times New Roman', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.6;
      background-image: 
        radial-gradient(circle at 50% 0%, #200518 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, #0d001a 0%, transparent 50%);
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      text-align: center;
      padding: 60px 20px 40px;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 3rem;
      letter-spacing: 0.3em;
      color: #fff;
      text-shadow: 0 0 15px var(--accent-red), 0 0 30px var(--accent-purple);
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
      letter-spacing: 0.15em;
    }

    /* 検索バー */
    .search-container {
      max-width: 500px;
      margin: 30px auto 0;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 25px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 10px rgba(230, 0, 51, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    /* メインコンテンツ */
    container {
      display: block;
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .band-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    /* バンドカード */
    .band-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .band-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--accent-red), var(--accent-purple));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .band-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-red);
      box-shadow: 0 10px 20px rgba(230, 0, 51, 0.2);
    }

    .band-card:hover::before {
      opacity: 1;
    }

    .band-name {
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 5px;
      letter-spacing: 0.05em;
    }

    .band-kana {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 15px;
    }

    .band-genre {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 10px;
      background: rgba(230, 0, 51, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(230, 0, 51, 0.3);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .band-desc {
      font-size: 0.88rem;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--accent-red);
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      padding: 35px;
      position: relative;
      box-shadow: 0 0 30px rgba(230, 0, 51, 0.3);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.8rem;
      cursor: pointer;
    }

    .modal-close:hover {
      color: var(--accent-red);
    }

    .modal-title {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 5px;
    }

    .modal-kana {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .modal-body {
      margin-top: 20px;
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.8;
    }

    .tags {
      margin-top: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: rgba(138, 43, 226, 0.2);
      border: 1px solid rgba(138, 43, 226, 0.4);
      color: #c89eff;
      border-radius: 4px;
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h1>V系</h1>
    <p>VISUAL KEI ARCHIVE & CATALOG</p>
    
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="バンド名やキーワードで検索...">
    </div>
  </header>

  <!-- メインリスト -->
  <container>
    <div class="band-grid" id="bandGrid"></div>
  </container>

  <!-- 詳細表示用モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-kana" id="modalKana"></div>
      <span class="band-genre" id="modalGenre"></span>
      <div class="modal-body" id="modalBody"></div>
      <div class="tags" id="modalTags"></div>
    </div>
  </div>

  <!-- フッター -->
  <footer>
    <p>&copy; V系 Visual Kei Archive. All Rights Reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script>
    // 12バンドのデータベース
    const bandsData = [
      {
        name: "X JAPAN",
        kana: "エックスジャパン",
        genre: "Symphonic Metal / Speed Metal",
        desc: "日本のヴィジュアル系の祖であり、世界的な影響力を持つ伝説的ロックバンド。超高速のメタルサウンドと哀愁漂う美しいバラード、過激なパフォーマンスで時代を創り上げた。",
        tags: ["レジェンド", "メタル", "シンフォニック"]
      },
      {
        name: "LUNA SEA",
        kana: "ルナシー",
        genre: "Post-Punk / Alternative Rock",
        desc: "緻密に構築された5人のアンサンブルと漆黒のダークな世界観で90年代V系シーンの頂点に立ったモンスターバンド。圧倒的なライブパフォーマンスで知られる。",
        tags: ["レジェンド", "オルタナティヴ", "漆黒"]
      },
      {
        name: "GLAY",
        kana: "グレイ",
        genre: "Pop Rock / Rock",
        desc: "キャッチーで美しいメロディと親しみやすいポップセンスで数々のミリオンセラーを連発。日本音楽史に残る動員記録を持つ国民的ロックバンド。",
        tags: ["ポップ", "メロディック", "国民的"]
      },
      {
        name: "HYDE",
        kana: "ハイド",
        genre: "Alternative Rock / Hard Rock",
        desc: "L'Arc〜en〜CielやVAMPSのフロントマンであり、唯一無二の歌声と洗練されたビジュアルで世界中にファンを持つカリスマアーティスト。",
        tags: ["ソロ", "カリスマ", "世界進出"]
      },
      {
        name: "DIR EN GREY",
        kana: "ディル アン グレイ",
        genre: "Avant-Garde Metal / Extreme Metal",
        desc: "人間の感情の深淵や「痛み」を徹底的に追求する世界観。ヘヴィかつ前衛的なサウンドで全米・欧州ツアーを精力的に行う孤高のアーティスト。",
        tags: ["ラウド", "エクストリーム", "世界評価"]
      },
      {
        name: "the GazettE",
        kana: "ガゼット",
        genre: "Heavy Rock / Nu Metal",
        desc: "2000年代以降のV系シーンを牽引し続ける異端児。アグレッシブな重低音と美麗なメロディラインを融合させ、日本武道館や東京ドーム公演を成功させた。",
        tags: ["ネオV系", "ヘヴィ", "ヘドバン"]
      },
      {
        name: "SID",
        kana: "シド",
        genre: "Pop Rock / Kayō Rock",
        desc: "昭和歌謡の情感漂うメロディと巧みな歌詞表現、高い技術力で魅了する人気バンド。アニメテーマソングも数多く手掛け、幅広い層から支持される。",
        tags: ["歌謡ロック", "ポップ", "キャッチー"]
      },
      {
        name: "摩天楼オペラ",
        kana: "マテンロウオペラ",
        genre: "Symphonic Power Metal",
        desc: "圧倒的なハイトーンボーカルと重厚なパイプオルガン・クラシック要素を融合させた、美しくも過激なシンフォニック・メタルを展開する。",
        tags: ["シンフォニック", "美旋律", "メタル"]
      },
      {
        name: "Versailles",
        kana: "ヴェルサイユ",
        genre: "Symphonic Metal / Gothic Rock",
        desc: "「薔薇の末裔」をコンセプトに、華麗な中世ヨーロッパ調の衣装とツインギターによる超絶技巧の叙情美メタルサウンドで構築された美の究極形。",
        tags: ["ゴシック", "薔薇", "超絶技巧"]
      },
      {
        name: "girugamesh",
        kana: "ギルガメッシュ",
        genre: "Industrial / Metalcore",
        desc: "骨太でアグレッシブなメタルコア・ラウドロックにデジタルエレクトロを取り入れた重厚なサウンドで、国内のみならず海外でも熱狂的な人気を集めた。",
        tags: ["ラウド", "メタルコア", "インダストリアル"]
      },
      {
        name: "Sadie",
        kana: "サディ",
        genre: "Heavy / Dark Gothic",
        desc: "ダークかつ重厚なヘヴィサウンドと狂気・グロテスクさを孕んだ世界観で、コテ系・ダーク系V系シーンの中心的存在として絶大な支持を得た。",
        tags: ["ダーク", "重厚", "コテ系"]
      },
      {
        name: "lynch.",
        kana: "リンチ",
        genre: "Alternative Metal / Metalcore",
        desc: "「ヘヴィ＆ビューティー」を提示し、洗練された重低音と叙情的な旋律を高次元で両立。名古屋系V系の系譜を継ぐ実力派ロックバンド。",
        tags: ["名古屋系", "ヘヴィ", "シャウト"]
      }
    ];

    // DOM要素の取得
    const bandGrid = document.getElementById('bandGrid');
    const searchInput = document.getElementById('searchInput');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalTitle = document.getElementById('modalTitle');
    const modalKana = document.getElementById('modalKana');
    const modalGenre = document.getElementById('modalGenre');
    const modalBody = document.getElementById('modalBody');
    const modalTags = document.getElementById('modalTags');

    // バンドカード一覧を描画する関数
    function renderBands(list) {
      bandGrid.innerHTML = '';
      if (list.length === 0) {
        bandGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-sub);">該当するバンドが見つかりません。</p>';
        return;
      }

      list.forEach(band => {
        const card = document.createElement('div');
        card.className = 'band-card';
        card.innerHTML = `
          <h2 class="band-name">${band.name}</h2>
          <div class="band-kana">${band.kana}</div>
          <span class="band-genre">${band.genre}</span>
          <p class="band-desc">${band.desc}</p>
        `;

        // カードクリックでモーダルを開く
        card.addEventListener('click', () => openModal(band));
        bandGrid.appendChild(card);
      });
    }

    // モーダルを開く処理
    function openModal(band) {
      modalTitle.textContent = band.name;
      modalKana.textContent = band.kana;
      modalGenre.textContent = band.genre;
      modalBody.textContent = band.desc;
      
      modalTags.innerHTML = band.tags.map(tag => `<span class="tag">#${tag}</span>`).join('');
      modalOverlay.classList.add('active');
    }

    // モーダルを閉じる処理
    modalClose.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    // 検索フィルター処理
    searchInput.addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase().trim();
      const filtered = bandsData.filter(band => 
        band.name.toLowerCase().includes(keyword) ||
        band.kana.includes(keyword) ||
        band.genre.toLowerCase().includes(keyword) ||
        band.tags.some(tag => tag.toLowerCase().includes(keyword))
      );
      renderBands(filtered);
    });

    // 初期描画
    renderBands(bandsData);
  </script>
</body>
</html>
